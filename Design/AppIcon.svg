<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061B3D"/>
      <stop offset="0.6" stop-color="#0D4A9E"/>
      <stop offset="1" stop-color="#1F7BEA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#5CC8FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#5CC8FF" stop-opacity="0"/>
