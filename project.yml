name: TrainingApp
options:
  bundleIdPrefix: com.andieswe420
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: sv

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "L9JH53FJU9"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  TrainingApp:
    type: application
    platform: iOS
    sources:
      - path: TrainingApp
    dependencies:
      - sdk: HealthKit.framework
      - sdk: WorkoutKit.framework
      - package: Supabase
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andieswe420.TrainingApp
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: TrainingApp/Info.plist
      properties:
        CFBundleDisplayName: Träning
        CFBundleDevelopmentRegion: sv
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        SupabaseHost: $(SUPABASE_HOST)
        SupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
        NSHealthShareUsageDescription: >-
          Appen läser dina träningspass, puls, pulsvariabilitet (HRV), VO2 max,
          sömn, steg, aktivitet, andningsfrekvens och handledstemperatur från
          Hälsa så att din coach kan följa formen och planera kommande pass.
        NSHealthUpdateUsageDescription: >-
          Appen behöver skrivbehörighet till Hälsa för att kunna spara och
          schemalägga träningspass som skickas till din Apple Watch.
    entitlements:
      path: TrainingApp/TrainingApp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

schemes:
  TrainingApp:
    build:
      targets:
        TrainingApp: all
    run:
      config: Debug
